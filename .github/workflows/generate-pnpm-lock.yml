name: Generate pnpm lockfile

on:
  push:
    branches:
      - chatgpt-dev
    paths:
      - package.json
      - .github/workflows/generate-pnpm-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for existing lockfile
        id: lock
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm and Node.js
        if: steps.lock.outputs.missing == 'true'
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@22
          install: false

      - name: Generate lockfile
        if: steps.lock.outputs.missing == 'true'
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        if: steps.lock.outputs.missing == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: generate pnpm lockfile"
          git push origin HEAD:chatgpt-dev
