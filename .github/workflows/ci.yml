name: CI

on:
  push:
    branches:
      - chatgpt-dev
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@22
          cache: true

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm lint

      - name: Build
        run: pnpm build
