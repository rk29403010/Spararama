name: CI

on:
  push:
    branches:
      - chatgpt-dev
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@22
          cache: true

      - name: Check local runners
        run: |
          node --check scripts/local.mjs
          node scripts/local.mjs help
          bash -n scripts/termux/spar scripts/termux/install.sh scripts/termux/https-setup.sh scripts/termux/https-config.sh
          bash test/termux/https-config.test.sh

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm lint

      - name: Build
        run: pnpm build